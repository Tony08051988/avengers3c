<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturn 360°旋轉星環支架磁吸手機殼  - 復仇者3C配件</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1c1f26;
            --accent-neon: #00f0ff;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        *, *::before, *::after { box-sizing: border-box; }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--accent-neon);
            text-align: center;
        }

        .product-detail {
            background-color: var(--card-bg);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        /* 統一設定所有圖片撐滿版面、圓角與間距 */
        .product-detail img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            object-fit: cover;
            pointer-events: none;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .product-features {
            list-style-type: none;
            padding-left: 0;
            margin: 0 0 15px 0;
        }

        .product-features li {
            font-size: 13.5px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 8px;
            position: relative;
            padding-left: 15px;
        }

        .product-features li::before {
            content: "•";
            color: var(--accent-neon);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        /* 下方多張展示圖的區塊分隔 */
        .extra-images {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
        }

        .back-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-neon);
            border: 2px solid var(--accent-neon);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
        }

        .back-btn:hover {
            background-color: var(--accent-neon);
            color: var(--bg-dark);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SKINARMA - Saturn 360°旋轉星環支架磁吸手機殼  </h1>
        
        <div class="product-detail">
            <!-- 1. 最上方原本的大圖 -->
            <img src="IMG_4569.jpeg" alt="Saturn 360°旋轉星環支架磁吸手機殼 ">
            
            <div class="product-title">Saturn 360°旋轉星環支架磁吸手機殼 </div>
            
            <ul class="product-features">
                <li>全新升級一體式強化防撞護角，有效提升防護力</li>
                <li>PC跳色按鍵設計，按壓靈敏、耐用不易磨損</li>
                <li>全新側邊立體凹槽紋理設計，提升握持穩定性</li></li>
                <li>一體式相機控制按鍵，拍攝操作更直覺便利</li>
                <li>全新可拆卸式鏡頭保護框設計，搭配質感 Logo 細節</li>
                <li>霧面／半透明 TPU 邊框，兼具質感與舒適握感</li>
                <li>八角型 360° 旋轉支架，支援多角度觀看與穩固站立</li>
                <li>支援無線充電</li>
            </ul>

            <!-- 2. 緊接著文字下方的兩張特寫圖 -->
            <div class="extra-images">
                <img src="IMG_4571.jpeg" alt="Magma冰藍款特寫">
                <img src="IMG_4573.jpeg" alt="Magma勃根地紅款特寫">
                <img src="IMG_4570.jpeg" alt="Magma勃根地紅款特寫">
                <img src="IMG_4572.jpeg" alt="Magma勃根地紅款特寫">
                <!-- 3. 最下方的其他實拍展示大圖 -->
                <img src="IMG_4579.jpeg" alt="實拍展示圖一">
                <img src="IMG_4575.jpeg" alt="實拍展示圖二">
                <img src="IMG_4584.jpeg" alt="編號一二三">
                <img src="IMG_4580.jpeg" alt="編號四五">
                <img src="IMG_4581.jpeg" alt="實拍展示圖三">
                <img src="IMG_4574.jpeg" alt="實拍展示圖四">
                <img src="IMG_4582.jpeg" alt="實拍展示圖五">
                <img src="IMG_4585.jpeg" alt="實拍展示圖六">
                <img src="IMG_4583.jpeg" alt="實拍展示圖七">
            </div>
        </div>

        <a href="skinarma18procase.html" class="back-btn">← 返回上一頁</a>
    </div>

</body>
</html>
