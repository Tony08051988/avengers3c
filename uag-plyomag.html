<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁吸耐衝擊全透保護殼- 復仇者3C配件</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1c1f26;
            --accent-neon: #00f0ff;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        *, *::before, *::after { box-sizing: border-box; }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--accent-neon);
            text-align: center;
        }

        .product-detail {
            background-color: var(--card-bg);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        /* 統一設定所有圖片撐滿版面、圓角與間距 */
        .product-detail img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            object-fit: cover;
            pointer-events: none;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .product-features {
            list-style-type: none;
            padding-left: 0;
            margin: 0 0 15px 0;
        }

        .product-features li {
            font-size: 13.5px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 8px;
            position: relative;
            padding-left: 15px;
        }

        .product-features li::before {
            content: "•";
            color: var(--accent-neon);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        /* 下方多張展示圖的區塊分隔 */
        .extra-images {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
        }

        .back-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-neon);
            border: 2px solid var(--accent-neon);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
        }

        .back-btn:hover {
            background-color: var(--accent-neon);
            color: var(--bg-dark);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>UAG - 磁吸耐衝擊全透保護殼 </h1>
        
        <div class="product-detail">
            <!-- 1. 最上方原本的大圖 -->
            <img src="IMG_6910.webp" alt="Saturn 360°旋轉星環支架磁吸手機殼 ">
            
            <div class="product-title">UAG 磁吸耐衝擊全透保護殼 </div>
            
            <ul class="product-features">
                <li>通過美國軍規耐衝擊認證</li>
                <li>高防護堅硬外殼、邊角橡膠吸震緩衝</li>
                <li>強化鏡頭孔位，邊框加高設計</li></li>
                <li>邊框設計升級，握感穩固不滑手</li>
                <li>有效抵擋UV紫外線、耐用抗泛黃</li>
                <li>材質輕量化設計、提供絕佳保護性</li>
                <li>雙吊繩孔位設計，增添實用性</li>
                <li>預留底部墊片空間，可搭配UAG背帶/手腕掛繩</li>
                <li>支援MagSafe及無線充電</li>
            </ul>

            <!-- 2. 緊接著文字下方的兩張特寫圖 -->
            <div class="extra-images">
                <img src="IMG_6910.webp" alt="Magma冰藍款特寫">
                <img src="IMG_6911.webp" alt="Magma勃根地紅款特寫">
                <img src="IMG_6912.webp" alt="Magma勃根地紅款特寫">
                <img src="IMG_6913.webp" alt="Magma勃根地紅款特寫">
                <!-- 3. 最下方的其他實拍展示大圖 -->
                <img src="IMG_6914.webp" alt="實拍展示圖一">
                <img src="IMG_6915.webp" alt="實拍展示圖二">
                <img src="IMG_6916.webp" alt="編號一二三">
                <img src="IMG_6917.webp" alt="編號四五">
                <img src="IMG_6918.webp" alt="實拍展示圖三">
                <img src="IMG_6919.webp" alt="實拍展示圖四">
                <img src="IMG_6920.webp" alt="實拍展示圖五">
                <img src="IMG_6921.webp" alt="實拍展示圖六">
                <img src="IMG_6922.webp" alt="實拍展示圖七">
                <img src="IMG_6923.webp" alt="好">
                <img src="IMG_6924.webp" alt="好0">
                <img src="IMG_6925.webp" alt="小">
                <img src="IMG_6926.webp" alt="選">
                <img src="IMG_6928.webp" alt="子">
            </div>
        </div>

        <a href="uag18procase.html" class="back-btn">← 返回上一頁</a>
    </div>

</body>
</html>
