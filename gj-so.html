<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國家地理 Magnetic Soft Case 磁吸保護殼 - 復仇者3C配件</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1c1f26;
            --accent-neon: #00f0ff;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        *, *::before, *::after { box-sizing: border-box; }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--accent-neon);
            text-align: center;
        }

        .product-detail {
            background-color: var(--card-bg);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        /* 統一設定所有圖片撐滿版面、圓角與間距 */
        .product-detail img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: -4px;
            object-fit: cover;
            pointer-events: none;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .product-features {
            list-style-type: none;
            padding-left: 0;
            margin: 0 0 15px 0;
        }

        .product-features li {
            font-size: 13.5px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 8px;
            position: relative;
            padding-left: 15px;
        }

        .product-features li::before {
            content: "•";
            color: var(--accent-neon);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        /* 下方多張展示圖的區塊分隔 */
        .extra-images {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
        }

        .back-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-neon);
            border: 2px solid var(--accent-neon);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
        }

        .back-btn:hover {
            background-color: var(--accent-neon);
            color: var(--bg-dark);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>國家地理 - Magnetic Soft Case 磁吸保護殼 </h1>
        
        <div class="product-detail">
            <!-- 1. 最上方原本的大圖 -->
            <img src="IMG_7800.webp" alt="Saturn 360°旋轉星環支架磁吸手機殼 ">
            
            <div class="product-title">國家地理 - Magnetic Soft Case 磁吸保護殼 </div>
            
            <ul class="product-features">
                <li>獨特的印刷技術，反映光線角度的印刷效果增添了獨特風采</li>
                <li>觸感柔軟的TPU+液態矽膠塗層，提供良好的握持感和彈性安裝，避免在取下或安裝殼時對手機本體造成損害</li>
                <li>精緻的全覆蓋設計，全方位保護，提供安全的設備保護</li>
                <li>螢幕邊緣設計提升高度，守護前螢幕，後置相機位置周全保護，防光照干擾</li>
                <li>兼容MagSafe 及多種磁吸配件</li>
            </ul>

            <!-- 2. 緊接著文字下方的兩張特寫圖 -->
            <div class="extra-images">
                <img src="IMG_7801.webp" alt="Magma冰藍款特寫">
                <img src="IMG_7802.webp" alt="Magma勃根地紅款特寫">
                <img src="IMG_7803.webp" alt="Magma勃根地紅款特寫">
                <img src="IMG_7804.webp" alt="Magma勃根地紅款特寫">
                <!-- 3. 最下方的其他實拍展示大圖 -->
                <img src="IMG_7805.webp" alt="實拍展示圖一">
                <img src="IMG_7806.webp" alt="實拍展示圖二">
                <img src="IMG_7807.webp" alt="編號一二三">
                <img src="IMG_7808.webp" alt="編號四五">
                <img src="IMG_7809.webp" alt="實拍展示圖三">
                <img src="IMG_7810.webp" alt="實拍展示圖四">
                <img src="IMG_7811.webp" alt="實拍展示圖五">
                <img src="IMG_7812.webp" alt="實拍展示圖六">
                <img src="IMG_7813.webp" alt="實拍展示圖七">
                <img src="IMG_7814.webp" alt="實拍展示圖七">
            </div>
        </div>

        <a href="gj18case.html" class="back-btn">← 返回上一頁</a>
    </div>

</body>
</html>
