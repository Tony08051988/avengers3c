<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇手機殼品牌 - 復仇者3C配件</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131825;
            --accent-neon: #00f0ff;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h2 {
            color: var(--accent-neon);
            font-size: 22px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-sub);
            font-size: 14px;
            margin: 0;
        }

        .brand-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .brand-card {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-neon);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-sizing: border-box;
            height: 140px;
        }

        .brand-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .brand-card img {
            width: 100%;
            height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
            background: #ffffff;
            padding: 5px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .brand-card span {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-sub);
        }

        .back-section {
            text-align: center;
            margin-top: 30px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 25px;
            border: 2px solid var(--accent-neon);
            color: var(--accent-neon);
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-neon);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>🛡️ 選擇手機殼品牌</h2>
            <p>為您的 iPhone 18 挑選頂級防摔軍規殼</p>
        </header>

        <div class="brand-grid">
            <!-- 品牌 1 -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="UAG">
                <span>UAG</span>
            </a>

            <!-- 品牌 2 -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="犀牛盾">
                <span>犀牛盾</span>
            </a>

            <!-- 品牌 3 -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="惡魔盾">
                <span>惡魔盾 (DEVILCASE)</span>
            </a>

            <!-- 品牌 4 -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="UNIQ">
                <span>UNIQ</span>
            </a>

            <!-- 品牌 5 -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="SKINARMA">
                <span>SKINARMA</span>
            </a>

            <!-- 品牌 6 -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="Hoda">
                <span>Hoda</span>
            </a>

            <!-- 品牌 7 -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="imos">
                <span>imos</span>
            </a>
        </div>

        <div class="back-section">
            <a href="iphone18-new.html" class="back-btn">&larr; 返回上一頁</a>
        </div>
    </div>

</body>
</html>
