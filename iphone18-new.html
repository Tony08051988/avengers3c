<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 18 新機旗艦專區 | 復仇者3C配件</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1c1f2680;
            --text-main: #e0e6ed;
            --text-sub: #8b95a5;
            --accent-neon: #00f0ff;
        }
        body {
            margin: 0;
            background-color: #000000;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }
        header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
            background-color: #0a0b0e;
            width: 100%;
        }
        h1 {
            font-size: 26px;
            letter-spacing: 3px;
            margin: 0;
            color: var(--accent-neon);
            text-transform: uppercase;
        }
        .container {
            padding: 20px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        .hero {
            text-align: center;
            padding: 20px 0 30px 0;
        }
        .hero h2 {
            font-size: 22px;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        .hero p {
            color: var(--text-sub);
            font-size: 14px;
        }
        .section-title {
            border-left: 4px solid var(--accent-neon);
            padding-left: 10px;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
            .product-card {
            background-color: var(--card-bg);
            padding: 10px 15px; /* 上下內距縮小 */
            border-radius: 8px;
            border: 1px solid #2a2e39;
            text-align: center;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: var(--accent-neon);
        }
        .product-card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
                .product-card img {
            width: auto !important;
            max-width: 80% !important;
            height: 120px !important; /* 高度稍微收窄一點點 */
            object-fit: contain !important;
            display: block !important;
            margin: 0 auto 8px auto !important; /* 圖片下方留白縮小 */
            background-color: transparent !important;
            border-radius: 4px !important;
        }




        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background: transparent;
            color: var(--accent-neon);
            border: 1px solid var(--accent-neon);
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>復仇者3C配件</h1>
    </header>

    <div class="container">
        <div class="hero">
            <h2>🔥 iPhone 18 新機旗艦專區</h2>
            <p>為您的全新旗艦手機量身打造，頂級防護一次到位</p>
        </div>

        <div class="section-title">選擇防護類別</div>

        <div class="product-grid">
            <!-- 分類一：品牌軍規殼 -->
            <div class="product-card" style="border: 2px solid var(--accent-neon); background: linear-gradient(135deg, #1c1f26 0%, #2a1f3d 100%);">
                <a href="iphone18-case.html">
                    <img src="IMG_3706.jpeg" alt="品牌軍規殼">
                    <h4 style="margin: 12px 0 5px 0; color: var(--accent-neon); font-size: 18px;">🛡️ 品牌軍規防摔手機殼</h4>
                    <p style="color: var(--text-sub); font-size: 13px; margin: 0;">頂級抗衝擊、軍規防摔認證</p>
                </a>
            </div>

            <!-- 分類二：鋼化玻璃貼 -->
            <div class="product-card" style="border: 2px solid var(--accent-neon); background: linear-gradient(135deg, #1c1f26 0%, #2a1f3d 100%);">
                <a href="iphone18-glass.html">
                    <img src="IMG_3716.jpeg" alt="鋼化玻璃貼">
                    <h4 style="margin: 12px 0 5px 0; color: var(--accent-neon); font-size: 18px;">✨ 鋼化玻璃螢幕保護貼</h4>
                    <p style="color: var(--text-sub); font-size: 13px; margin: 0;">極致抗刮、超清透防護</p>
                </a>
            </div>

            <!-- 分類三：鏡頭保護貼 -->
            <div class="product-card" style="border: 2px solid var(--accent-neon); background: linear-gradient(135deg, #1c1f26 0%, #2a1f3d 100%);">
                <a href="iphone18-lens.html">
                    <img src="IMG_3714.jpeg" alt="鏡頭保護貼">
                    <h4 style="margin: 12px 0 5px 0; color: var(--accent-neon); font-size: 18px;">📸 藍寶石高透鏡頭保護貼</h4>
                    <p style="color: var(--text-sub); font-size: 13px; margin: 0;">無損高透不反光、完美保護鏡頭</p>
                </a>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-btn">← 返回首頁</a>
        </div>
    </div>

</body>
</html>
