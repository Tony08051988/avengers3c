<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coehl Vela 水波紋磁吸保護殼 - 復仇者3C配件</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1c1f26;
            --accent-neon: #00f0ff;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        *, *::before, *::after { box-sizing: border-box; }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--accent-neon);
            text-align: center;
        }

        .product-detail {
            background-color: var(--card-bg);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        /* 統一設定所有圖片撐滿版面、圓角與間距 */
        .product-detail img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            object-fit: cover;
            pointer-events: none;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .product-features {
            list-style-type: none;
            padding-left: 0;
            margin: 0 0 15px 0;
        }

        .product-features li {
            font-size: 13.5px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 8px;
            position: relative;
            padding-left: 15px;
        }

        .product-features li::before {
            content: "•";
            color: var(--accent-neon);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        /* 下方多張展示圖的區塊分隔 */
        .extra-images {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
        }

        .back-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-neon);
            border: 2px solid var(--accent-neon);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
        }

        .back-btn:hover {
            background-color: var(--accent-neon);
            color: var(--bg-dark);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>UNIQ - Coehl Vela 水波紋磁吸保護殼 </h1>
        
        <div class="product-detail">
            <!-- 1. 最上方原本的大圖 -->
            <img src="IMG_5382.webp" alt="Saturn 360°旋轉星環支架磁吸手機殼 ">
            
            <div class="product-title">RHINOSHIELD AirX 氣墊緩衝磁吸防摔手機殼 </div>
            
            <ul class="product-features">
                <li>IML PC材質：彩虹光感，閃耀耐用</li>
                <li>透明TPU：保護同時展現原機色彩</li>
                <li>支援磁吸功能：溫柔色系，充電也時尚</li></li>
                <li>附可替換掛扣組</li>
                <li>支援無線靈感源自水面上輕柔水波紋，每一次觸碰，都如微波般綻放優雅。Vela 不只是保護殼，更是一種 靜謐而高雅的美感。
</li>
            </ul>

            <!-- 2. 緊接著文字下方的兩張特寫圖 -->
            <div class="extra-images">
                <img src="IMG_5375.webp" alt="Magma冰藍款特寫">
                <img src="IMG_5376.webp" alt="Magma勃根地紅款特寫">
                <img src="IMG_5377.webp" alt="Magma勃根地紅款特寫">
                <img src="IMG_5378.webp" alt="Magma勃根地紅款特寫">
                <!-- 3. 最下方的其他實拍展示大圖 -->
                <img src="IMG_5379.webp" alt="實拍展示圖一">
                <img src="IMG_5380.webp" alt="實拍展示圖二">
                <img src="IMG_5381.webp" alt="編號一二三">
            </div>
        </div>

        <a href="rhinoshield18procase.html" class="back-btn">← 返回上一頁</a>
    </div>

</body>
</html>
