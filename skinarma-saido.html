<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saido 磁吸基本款 - 復仇者3C配件</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1c1f26;
            --accent-neon: #00f0ff;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--accent-neon);
            text-align: center;
        }

        .product-detail {
            background-color: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .product-detail img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-neon);
            border: 1px solid var(--accent-neon);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .back-btn:hover {
            background-color: var(--accent-neon);
            color: var(--bg-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SKINARMA - Saido 磁吸基本款</h1>
        
        <div class="product-detail">
            <img src="IMG_4431.webp" alt="Saido磁吸基本款">
            <div class="product-title">Saido 輕透防摔磁吸保護殼</div>
            <div class="product-desc">
                採用高防禦力抗黃化材質，結合強效磁吸圈，完美支援 MagSafe 各類磁吸配件。簡約俐落的軍規防摔設計，給您的愛機全方位的安全保護同時展現原機質感。
            </div>
        </div>

        <a href="skinarma18procase.html" class="back-btn">← 返回上一頁</a>
