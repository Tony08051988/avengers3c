<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復仇者 3C 配件 | 專業防護與客製</title>
    <style>
        /* 工業科技風設計參數 */
        :root {
            --bg-dark: #0f1115; /* 深色金屬背景 */
            --card-bg: #1c1f2680; /* 卡片底色 */
            --text-main: #e0e6ed; /* 乾淨亮灰字體 */
            --text-sub: #8b95a5; /* 說明文字 */
            --accent-neon: #00f0ff; /* 科技感霓虹藍 */
        }
       body {
    margin: 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    /* --- 完美科技黑底與精緻格線 --- */
    background-color: #000000;
    background-image: linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 20px 20px;
    /* ----------------------------- */
    color: var(--text-main);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 50px;
}

/* 確保標題周圍沒有多餘的黑方塊干擾 */
header, .header-container {
    background: transparent !important;
}

}

        header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
            background-color: #0a0b0e;
        }
        h1 {
            font-size: 26px;
            letter-spacing: 3px;
            margin: 0;
            color: var(--accent-neon);
            text-transform: uppercase;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero {
            text-align: center;
            padding: 30px 0;
        }
        h2 { font-size: 22px; margin-bottom: 10px; }
        .hero p { color: var(--text-sub); font-size: 15px; }
        
        .section-title {
            border-left: 4px solid var(--accent-neon);
            padding-left: 10px;
            margin-top: 30px;
            font-size: 18px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a2e39;
            text-align: center;
        }
        /* 這裡是未來給主人換圖片的預留區塊 */
        .img-placeholder {
            width: 100%;
            height: 200px;
            background-color: #262a33;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 14px;
            border: 1px dashed #444;
        }
        .btn {
            display: inline-block;
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 14px 28px;
            background-color: transparent;
            color: var(--accent-neon);
            border: 1px solid var(--accent-neon);
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header>
        <h1>復仇者3C配件</h1>
    </header>
    
    <div class="container">
        <div class="hero">
            <h2>極致防護 · 頂級防禦</h2>
            <p>為您的手機設備提供高規格的強悍武裝</p>
        </div>

        <div class="section-title">熱門品牌系列</div>
        
        <div class="product-grid">
            <!-- 第一個商品區塊 -->
            <div class="product-card">
                <div class="img-placeholder">圖片預留區 1 (之後教您換上實拍圖)</div>
                <h4 style="margin: 10px 0 5px 0;">軍規防摔手機殼</h4>
                <p style="font-size: 13px; color: var(--text-sub); margin: 0;">抵抗衝擊 完美守護</p>
            </div>
            
            <!-- 第二個商品區塊 -->
            <div class="product-card">
                <div class="img-placeholder">圖片預留區 2 (之後教您換上實拍圖)</div>
                <h4 style="margin: 10px 0 5px 0;">藍寶石高透鏡頭保護貼</h4>
                <p style="font-size: 13px; color: var(--text-sub); margin: 0;">無損高透不反光 完美守護鏡頭不刮傷</p>
            </div>
        </div>

        <div style="text-align: center;">
        <a href="https://line.me/ti/p/e0ay0n19au" class="btn" target="_blank">LINE 線上諮詢 / 預約</a>

        </div>
    </div>
</body>
</html>
