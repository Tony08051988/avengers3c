<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇品牌 | 復仇者3C配件</title>
    <style>
        :root { --bg-dark: #0f1115; --card-bg: #1c1f26; --text-main: #e0e6ed; --accent-neon: #00f0ff; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; padding: 20px; text-align: center; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; }
        h1 { font-size: 20px; margin-bottom: 30px; }
        .brand-card { 
            background-color: var(--card-bg); 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            text-decoration: none; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 50px; /* 統一卡片內高度 */
            transition: 0.3s; 
            margin-bottom: 20px;
        }
        .brand-card:hover { border-color: var(--accent-neon); transform: translateY(-5px); }
        .brand-card img { 
            max-height: 42px; /* 統一限制圖片的最大高度 */
            max-width: 100%; 
            object-fit: contain; 
            display: block; 
        }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; color: #888; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>請選擇品牌</h1>
        
        <!-- UAG -->

        </a>

        <!-- 犀牛盾 -->

        </a>

        <!-- 惡魔盾 -->
        <a href="devilhive-models.html" class="brand-card">
            <img src="IMG_2778.jpeg" alt="惡魔盾">
        </a>

        <!-- UNIQ -->
        <a href="uniq-models.html" class="brand-card">
            <img src="IMG_2780.jpeg" alt="UNIQ">
        </a>

        <!-- SKINARMA -->
        <a href="skinarma-models.html" class="brand-card">
            <img src="IMG_2781.jpeg" alt="SKINARMA">
        </a>

        <!-- 國家地理頻道 -->
        <a href="natgeo-models.html" class="brand-card">
            <img src="IMG_2782.jpeg" alt="國家地理頻道">
        </a>

        <!-- imos -->
        <a href="imos-models.html" class="brand-card">
            <img src="IMG_2783.jpeg" alt="imos">
        </a>

        <!-- Hoda -->
        <a href="hoda-models.html" class="brand-card">

        <a href="index.html" class="back-btn">← 返回首頁</a>
    </div>
</body>
</html>
