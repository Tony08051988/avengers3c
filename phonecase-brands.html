<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇手機品牌 | 復仇者3C配件</title>
    <style>
        /* 延續首頁的科技風設定 */
        :root { --bg-dark: #0f1115; --card-bg: #1c1f26; --text-main: #e0e6ed; --accent-neon: #00f0ff; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .brand-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .brand-card { background-color: var(--card-bg); padding: 30px; border-radius: 8px; border: 1px solid #333; text-decoration: none; color: var(--text-main); transition: 0.3s; }
        .brand-card:hover { border-color: var(--accent-neon); transform: translateY(-5px); }
        .back-btn { display: inline-block; margin-top: 40px; padding: 10px 20px; border: 1px solid var(--accent-neon); color: var(--accent-neon); text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>選擇手機品牌</h1>
        <div class="brand-grid">
            <a href="iphone-models.html" class="brand-card"><h3>iPhone</h3></a>
            <a href="samsung-models.html" class="brand-card"><h3>Samsung</h3></a>
            <a href="google-models.html" class="brand-card"><h3>Google Pixel</h3></a>
            <a href="sony-models.html" class="brand-card"><h3>Sony</h3></a>
        </div>
        <a href="index.html" class="back-btn">返回首頁</a>
    </div>
</body>
</html>
