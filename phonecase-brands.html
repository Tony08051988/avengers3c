<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇品牌 | 復仇者3C配件</title>
    <style>
        :root { --bg-dark: #0f1115; --card-bg: #1c1f26; --text-main: #e0e6ed; --accent-neon: #00f0ff; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { margin-bottom: 40px; }
        /* 圖片品牌卡片 */
        .brand-card { 
            background-color: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            border: 2px solid #333; 
            display: block; 
            transition: 0.3s; 
        }
        .brand-card:hover { border-color: var(--accent-neon); transform: translateY(-5px); }
        .back-btn { display: inline-block; margin-top: 40px; padding: 10px 20px; border: 1px solid #555; color: #888; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>請選擇品牌</h1>
        
        <!-- UAG 品牌入口 -->
        <a href="uag-series.html" class="brand-card">
            <img src="IMG_1735.webp" alt="UAG" style="width: 100%; height: 150px; object-fit: contain;">
        </a>

        <a href="index.html" class="back-btn">返回首頁</a>
    </div>
</body>
</html>
