<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇品牌 | 復仇者3C配件</title>
    <style>
        :root { --bg-dark: #0f1115; --card-bg: #1c1f26; --text-main: #e0e6ed; --accent-neon: #00f0ff; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; padding: 20px; text-align: center; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; }
        h1 { font-size: 20px; margin-bottom: 25px; }
        
        /* 雙欄網格佈局 */
        .brand-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .brand-card { 
            background-color: var(--card-bg); 
            padding: 14px 8px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 105px; 
            transition: 0.3s; 
        }
        .brand-card:hover { border-color: var(--accent-neon); transform: translateY(-3px); }
        
        .brand-card img { 
            object-fit: contain; 
            display: block; 
            margin-bottom: 6px; 
        }

        /* 針對每一個 Logo 個別精準放大，讓其在框內達到最佳視覺比例 */
        .logo-uag { height: 38px; width: 100%; }
        .logo-rhino { height: 58px; width: 100%; }
        .logo-devil { height: 50px; width: 100%; }
        .logo-uniq { height: 54px; width: 100%; }
        .logo-skinarma { height: 50px; width: 100%; }
        .logo-natgeo { height: 42px; width: 100%; }
        .logo-imos { height: 44px; width: 100%; }
        .logo-hoda { height: 42px; width: 100%; }
        .logo-voorca { height: 36px; width: 100%; }

        .brand-name {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }
        .back-btn { display: inline-block; margin-top: 30px; padding: 10px 20px; color: #888; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>請選擇品牌</h1>
        
        <div class="brand-grid">
            <!-- UAG -->
            <a href="uag-models.html" class="brand-card">
                <img src="IMG_1735.webp" alt="UAG" class="logo-uag">
                <span class="brand-name">UAG</span>
            </a>

            <!-- 犀牛盾 -->
            <a href="rhinoshield-models.html" class="brand-card">
                <img src="IMG_2779.webp" alt="犀牛盾" class="logo-rhino">
                <span class="brand-name">犀牛盾</span>
            </a>

            <!-- 惡魔盾 -->
            <a href="devilhive-models.html" class="brand-card">
                <img src="IMG_2778.jpeg" alt="惡魔盾" class="logo-devil">
                <span class="brand-name">惡魔盾</span>
            </a>

            <!-- UNIQ -->
            <a href="uniq-models.html" class="brand-card">
                <img src="IMG_2780.jpeg" alt="UNIQ" class="logo-uniq">
                <span class="brand-name">UNIQ</span>
            </a>

            <!-- SKINARMA -->
            <a href="skinarma-models.html" class="brand-card">
                <img src="IMG_2781.jpeg" alt="SKINARMA" class="logo-skinarma">
                <span class="brand-name">SKINARMA</span>
            </a>

            <!-- 國家地理頻道 -->
            <a href="natgeo-models.html" class="brand-card">
                <img src="IMG_2782.jpeg" alt="國家地理頻道" class="logo-natgeo">
                <span class="brand-name">國家地理</span>
            </a>

            <!-- imos -->
            <a href="imos-models.html" class="brand-card">
                <img src="IMG_2783.jpeg" alt="imos" class="logo-imos">
                <span class="brand-name">imos</span>
            </a>

            <!-- Hoda -->
            <a href="hoda-models.html" class="brand-card">
                <img src="IMG_2784.webp" alt="Hoda" class="logo-hoda">
                <span class="brand-name">Hoda</span>
            </a>

            <!-- VOORCA -->
            <a href="voorca-models.html" class="brand-card">
                <img src="IMG_2793.webp" alt="VOORCA" class="logo-voorca">
                <span class="brand-name">VOORCA</span>
            </a>
        </div>
        
        <a href="index.html" class="back-btn">← 返回首頁</a>
    </div>
</body>
</html>
