<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鋼化玻璃保護貼系列 | 復仇者3C配件</title>
    <style>
        :root { 
            --bg-dark: #0f1115; 
            --card-bg: #1c1f26; 
            --text-main: #e0e6ed; 
            --accent-neon: #00f0ff; 
        }
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: sans-serif; 
            padding: 20px; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .container { 
            max-width: 600px; 
            width: 100%; 
        }
        h1 { 
            text-align: center; 
            color: var(--accent-neon); 
            font-size: 24px; 
            margin-bottom: 30px; 
        }
        .glass-list { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .glass-card { 
            background-color: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #333; 
        }
        .glass-card h3 { 
            margin: 0 0 8px 0; 
            color: var(--accent-neon); 
            font-size: 18px; 
        }
        .glass-card p { 
            margin: 0; 
            color: #aaa; 
            font-size: 14px; 
            line-height: 1.5; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>鋼化玻璃保護貼系列</h1>
        
        <div class="glass-list">
            <div class="glass-card">
                <h3>1. 高透光9H鋼化玻璃</h3>
                <p>透光度佳 邊緣不刮手 最經典的日常防護首選。</p>
            </div>
            <div class="glass-card">
                <h3>2. 電競霧面消光鋼化玻璃</h3>
                <p>拒絕指紋殘留 手感滑順不澀</p>
            </div>
            <div class="glass-card">
                <h3>3. 隱私防窺鋼化玻璃</h3>
                <p>有效保護個人隱私 隨時守護機密</p>
            </div>
            <div class="glass-card">
                <h3>4. 全能霧面防偷窺鋼化玻璃</h3>
                <p>抗指紋+防偷窺 預防機密洩漏首選</p>
            </div>
            <div class="glass-card">
                <h3>5. 護眼抗藍光鋼化玻璃</h3>
                <p>有效過濾螢幕有害光 保護視力更輕鬆</p>
            </div>
            <div class="glass-card">
                <h3>6. 霧面抗藍光鋼化玻璃</h3>
                <p>護眼與手感兼具 舒適觀影新體驗</p>
            </div>
            <div class="glass-card">
                <h3>7. 4倍強化極致耐衝擊玻璃</h3>
                <p>通過落球測試與壓邊測試 防護大幅提升</p>
            </div>
            <div class="glass-card">
                <h3>8. 頂級康寧玻璃</h3>
                <p>特殊鍍膜處理 原廠螢幕等級玻璃 兼具絲滑與防護</p>
            </div>
        </div>

        <!-- 獨立且位置完美下移的返回主頁按鈕 -->
        <div style="text-align: center; margin-top: 50px; margin-bottom: 30px;">
            <a href="index.html" style="color: var(--accent-neon); text-decoration: none; font-size: 16px;">&larr; 返回主頁</a>
        </div>
    </div>
</body>
</html>
