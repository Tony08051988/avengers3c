<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復仇者3C配件</title>
    <style>
        :root { --bg-dark: #0f1115; --card-bg: #1c1f26; --text-main: #e0e6ed; --accent-neon: #00f0ff; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; padding: 20px; text-align: center; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; }
        
        .category-grid { display: flex; flex-direction: column; gap: 20px; }
        
        .category-card { 
            background-color: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid #333; 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: 0.3s; 
            color: inherit;
        }
        .category-card:hover { border-color: var(--accent-neon); transform: translateY(-3px); }
        
        .category-card h3 { color: var(--text-main); margin: 0 0 5px 0; }
        .category-card p { color: #888; margin: 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>商品分類</h1>
        
        <div class="category-grid">
            <!-- 軍規防摔手機殼 -->
            <a href="phonecase-brands.html" class="category-card">
                <h3>軍規防摔手機殼</h3>
                <p>抵抗衝擊 完美守護</p>
            </a>

            <!-- 鋼化玻璃保護貼 -->
            <a href="tempered-glass-types.html" class="category-card">
                <h3>鋼化玻璃保護貼</h3>
                <p>極致抗刮 超清透防護</p>
            </a>

            <!-- 藍寶石高透鏡頭保護貼 -->
            <a href="lens-protection.html" class="category-card">
                <h3>藍寶石高透鏡頭保護貼</h3>
                <p>無損高透不反光 完美守護鏡頭不刮傷</p>
            </a>
        </div>
    </div>
</body>
</html>
