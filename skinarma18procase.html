<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKINARMA 系列選擇 - 復仇者3C配件</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1c1f26;
            --accent-neon: #00f0ff;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 25px;
            text-align: center;
            color: var(--accent-neon);
        }

        /* 雙欄網格佈局 */
        .brand-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .brand-card {
            background-color: var(--card-bg);
            padding: 8px 8px 6px 8px;
            border-radius: 12px;
            border: 2px solid var(--accent-neon);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 150px;
            overflow: hidden;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .brand-card:hover {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: translateY(-2px);
        }

        /* 圖片區塊 */
        .brand-card img {
            width: 100%;
            height: 85px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
            background-color: #333;
        }

        /* 系列名稱 */
        .brand-name {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
            margin-top: 4px;
            text-align: center;
            line-height: 1.2;
        }

        .back-section {
            text-align: center;
            margin-top: 30px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 25px;
            border: 2px solid var(--accent-neon);
            color: var(--accent-neon);
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-neon);
            color: var(--bg-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SKINARMA 系列選擇</h1>

        <div class="brand-grid">
            <!-- 1. Saido -->
        <a href="#⁠" class="brand-card">
                <img src="IMG_3749.jpeg" alt="Saido磁吸基本款">
                <span class="brand-name">Saido磁吸基本款</span>
            </a>

            <!-- 2. Magma -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="Magma磁吸金屬款">
                <span class="brand-name">Magma磁吸金屬款</span>
            </a>

            <!-- 3. Sanar -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="Sanar城市山系機能磁吸款">
                <span class="brand-name">Sanar城市山系機能磁吸款</span>
            </a>

            <!-- 4. Helio CE -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="Helio CE磁吸支架款">
                <span class="brand-name">Helio CE磁吸支架款</span>
            </a>

            <!-- 5. Saturn -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="Saturn 360旋轉星環磁吸支架款">
                <span class="brand-name">Saturn 360旋轉星環磁吸支架款</span>
            </a>

            <!-- 6. Atlas -->
            <a href="#" class="brand-card">
                <img src="IMG_3749.jpeg" alt="Atlas抗震氣囊支架防摔殼">
                <span class="brand-name">Atlas抗震氣囊支架防摔殼</span>
            </a>
        </div>

        <div class="back-section">
            <a href="iphone18-case.html" class="back-btn">&larr; 返回上一頁</a>
        </div>
    </div>

</body>
</html>
